name: StoreMCP public uptime

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      simulate_failure:
        description: 'Test failure notifications without changing the application'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: public-uptime
  cancel-in-progress: false

jobs:
  probe:
    # Skip before allocating a runner if this repository is made private.
    if: github.event.repository.private == false && (github.event_name == 'workflow_dispatch' || vars.MONITOR_ENABLED == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - run: python3 -m unittest -v
      - name: Probe public application
        env:
          SIMULATE_FAILURE: ${{ github.event_name == 'workflow_dispatch' && inputs.simulate_failure && '1' || '0' }}
        run: |
          if [ "$SIMULATE_FAILURE" = '1' ]; then
            python3 probe.py --simulate-failure
          else
            python3 probe.py
          fi
